<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111418">
  <title>404 Love Not Found | Droidr</title>
  <link rel="stylesheet" href="sad.css">
</head>
<body>
  <main class="sad-shell">
    <section class="sad-card" aria-labelledby="sad-title">
      <h1 id="sad-title">404 LOVE NOT FOUND</h1>
      <img class="sad-robot" src="assets/profiles/sad-robot.png" alt="A sad robot with broken hearts for eyes">
      <p class="sad-message">
        You rejected<br>
        everyone.<br>
        You’ll never find<br>
        love<br>
        <em>*Sad music plays*</em>
      </p>
      <button class="sad-retry" type="button" aria-label="Try again">
        <img src="assets/figma-swipe/action-nope.svg" alt="">
      </button>
    </section>

    <nav class="sad-nav" aria-label="Main navigation">
      <button class="sad-nav-button" type="button" aria-label="Search">
        <img src="assets/figma-swipe/nav-search.svg" alt="">
      </button>
      <button class="sad-nav-button" type="button" aria-label="Highlights">
        <img src="assets/figma-swipe/nav-sparkle.svg" alt="">
      </button>
      <button class="sad-nav-button sad-messages" type="button" aria-label="Messages">
        <img src="assets/figma-swipe/nav-messages.svg" alt="">
        <span aria-hidden="true"></span>
      </button>
      <button class="sad-nav-button" type="button" aria-label="Profile">
        <img src="assets/figma-swipe/nav-profile.svg" alt="">
      </button>
    </nav>
  </main>
</body>
</html>
