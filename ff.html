<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111518">
    <title>My first name is</title>
    <link rel="stylesheet" href="ff.css">
</head>
<body>
    <main class="screen">
        <form id="F_name-form">
            <h1 id="title">My first name is</h1>
            <input id="F_names" name="F_name" type="text" aria-labelledby="title" autocomplete="off">
            <p class="preview">This is how it will appear in Droidr.</p>
            <button class="agree-button" id="agree" type="submit">I Agree</button>
            <p class="message" id="message" aria-live="polite"></p>
        </form>
    </main>

    <script>
        const form = document.querySelector("#F_name-form");
        const F_namesInput = document.querySelector("#F_names");
        const agreeButton = document.querySelector("#agree");
        const message = document.querySelector("#message");

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            if (!F_namesInput.value.trim()) {
                message.textContent = "Add a name to continue.";
                F_namesInput.focus();
                return;
            }

            window.location.href = "passion.html";
        });

        F_namesInput.addEventListener("input", () => {
            message.textContent = "";
        });
    </script>
</body>
</html>
