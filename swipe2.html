<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111418">
  <title>Bosch KGN49XLEA 5 | Droidr</title>
  <link rel="stylesheet" href="swipe2.css">
</head>
<body>
  <main class="app-shell">
    <section class="profile-card profile-fridge" aria-labelledby="profile-name">
      <div class="profile-visual" aria-hidden="true">
        <img class="portrait fridge-portrait" src="assets/profiles/fridge.png" alt="">
        <img class="fridge-eyes" src="assets/profiles/fridge-eyes.png" alt="">
      </div>

      <img class="verified-badge" src="assets/figma-swipe/verified-badge.svg" alt="Verified profile">

      <div class="profile-copy">
        <h1 id="profile-name">Bosch KGN49XLEA 5</h1>
        <div class="interest-list" role="list" aria-label="Interests">
          <div class="interest-row">
            <span class="interest fridge-produce" role="listitem">Fresh produce</span>
            <span class="interest fridge-cooks" role="listitem">Professional cooks</span>
          </div>
          <div class="interest-row">
            <span class="interest fridge-environments" role="listitem">Cold environments</span>
            <span class="interest fridge-spenders" role="listitem">Big spenders</span>
          </div>
          <div class="interest-row">
            <span class="interest fridge-beach" role="listitem">Long walks on the beach</span>
          </div>
        </div>
      </div>

      <div class="profile-actions" role="group" aria-label="Profile actions">
        <button class="action-button action-rewind" type="button" aria-label="Rewind">
          <img src="assets/figma-swipe/action-rewind.svg" alt="">
        </button>
        <button class="action-button action-nope" id="pass-button" type="button" aria-label="Pass">
          <img src="assets/figma-swipe/action-nope.svg" alt="">
        </button>
        <button class="action-button action-favorite" type="button" aria-label="Super like">
          <img src="assets/figma-swipe/action-favorite.svg" alt="">
        </button>
        <button class="action-button action-like" type="button" aria-label="Like">
          <img src="assets/figma-swipe/action-like.svg" alt="">
        </button>
        <button class="action-button action-boost" type="button" aria-label="Boost">
          <img src="assets/figma-swipe/action-boost.svg" alt="">
        </button>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-button nav-current" type="button" aria-label="Discover" aria-current="page">
        <img class="nav-flame" src="assets/figma-swipe/nav-flame.png" alt="">
      </button>
      <button class="nav-button" type="button" aria-label="Search">
        <img src="assets/figma-swipe/nav-search.svg" alt="">
      </button>
      <button class="nav-button" type="button" aria-label="Highlights">
        <img src="assets/figma-swipe/nav-sparkle.svg" alt="">
      </button>
      <button class="nav-button nav-messages" type="button" aria-label="Messages">
        <img src="assets/figma-swipe/nav-messages.svg" alt="">
        <span class="notification-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-button" type="button" aria-label="Profile">
        <img src="assets/figma-swipe/nav-profile.svg" alt="">
      </button>
    </nav>
  </main>
  <script>
    document.querySelector("#pass-button").addEventListener("click", () => {
      window.location.href = "swipe3.html";
    });
  </script>
</body>
</html>
